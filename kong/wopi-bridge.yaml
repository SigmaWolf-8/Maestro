_format_version: "3.0"

services:
  - name: wopi-host
    url: http://localhost:3000/api/wopi
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 60000
    retries: 2
    routes:
      - name: wopi-discovery
        paths: ["/wopi/discovery"]
        methods: [GET]
        strip_path: false

      - name: wopi-check-file-info
        paths: ["/wopi/files"]
        methods: [GET]
        strip_path: false

      - name: wopi-get-file
        paths: ["~/wopi/files/.+/contents$"]
        methods: [GET]
        strip_path: false

      - name: wopi-put-file
        paths: ["~/wopi/files/.+/contents$"]
        methods: [POST]
        strip_path: false

      - name: wopi-lock-operations
        paths: ["~/wopi/files/.+/(lock|unlock|refreshlock|unlockAndRelock)$"]
        methods: [POST]
        strip_path: false

      - name: wopi-file-operations
        paths: ["~/wopi/files/.+/(delete|rename|shareurl)$"]
        methods: [POST, GET]
        strip_path: false

    plugins:
      - name: cors
        config:
          origins:
            - "https://*.officeapps.live.com"
            - "https://*.office.com"
            - "https://*.officeppe.com"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - X-WOPI-Override
            - X-WOPI-Lock
            - X-WOPI-OldLock
            - X-WOPI-LockFailureReason
            - X-WOPI-LockedByOtherInterface
            - X-WOPI-SuggestedTarget
            - X-WOPI-RelativeTarget
            - X-WOPI-ItemVersion
            - X-WOPI-ValidRelativeTarget
          exposed_headers:
            - X-WOPI-Lock
            - X-WOPI-LockFailureReason
            - X-WOPI-LockedByOtherInterface
            - X-WOPI-ItemVersion
          credentials: true
          max_age: 86400

      - name: rate-limiting
        config:
          minute: 300
          hour: 5000
          policy: local

      - name: request-size-limiting
        config:
          allowed_payload_size: 100
