name: Deploy to Replit

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "docs/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: "20"

jobs:
  validate:
    name: Pre-Deploy Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit --skipLibCheck

      - name: Build
        run: npx vite build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Replit deployment
        run: |
          echo "=== Deployment Summary ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}"
          echo "Triggered by: ${{ github.actor }}"
          echo ""
          echo "Replit deployment is managed via Replit's publish system."
          echo "Push to main triggers auto-sync with Replit workspace."
          echo "Use Replit's Publish button to deploy to production."

      - name: Create deployment record
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: (await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: '${{ github.event.inputs.environment || "production" }}',
                auto_merge: false,
                required_contexts: [],
                description: 'Maestro ERP deployment'
              })).data.id,
              state: 'success',
              description: 'Deployed via Replit',
              environment: '${{ github.event.inputs.environment || "production" }}'
            });
