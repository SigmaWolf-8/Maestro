name: Database Migration Check

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "shared/schema.ts"
      - "shared/schema/**"
      - "drizzle.config.ts"

jobs:
  migration-check:
    name: Schema Change Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate schema compiles
        run: npx tsc --noEmit --skipLibCheck shared/schema.ts

      - name: Check barrel exports
        run: |
          for domain in tenants users projects wbs documents subscriptions billing; do
            if [ ! -f "shared/schema/${domain}.ts" ]; then
              echo "ERROR: Missing barrel export shared/schema/${domain}.ts"
              exit 1
            fi
          done
          echo "All barrel exports present."

      - name: Detect schema changes
        id: schema-diff
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} -- shared/schema.ts shared/schema/)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          TABLE_CHANGES=$(git diff ${{ github.event.pull_request.base.sha }} -- shared/schema.ts | grep -E "^\+.*pgTable|^\+.*serial|^\+.*varchar|^\+.*integer|^\+.*text|^\+.*timestamp|^\+.*boolean|^\+.*jsonb" || true)
          echo "table_changes<<EOF" >> $GITHUB_OUTPUT
          echo "$TABLE_CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if echo "$TABLE_CHANGES" | grep -q "pgTable"; then
            echo "has_new_tables=true" >> $GITHUB_OUTPUT
          else
            echo "has_new_tables=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate migration preview
        run: |
          echo "=== Migration Preview ==="
          echo "Changed files:"
          echo "${{ steps.schema-diff.outputs.changed_files }}"
          echo ""
          echo "New tables detected: ${{ steps.schema-diff.outputs.has_new_tables }}"
          echo ""
          echo "IMPORTANT: Schema changes require review before deployment."
          echo "Generate migration: ./scripts/generate-migration.sh <name>"
          echo "Or push directly: npm run db:push"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const hasNewTables = '${{ steps.schema-diff.outputs.has_new_tables }}' === 'true';
            const changedFiles = `${{ steps.schema-diff.outputs.changed_files }}`;

            const severity = hasNewTables ? 'NEW TABLES DETECTED' : 'Column/Type Changes';

            const body = `### Database Schema Change Detected (${severity})

            **Changed files:**
            \`\`\`
            ${changedFiles}
            \`\`\`

            #### Pre-merge Checklist:
            - [ ] New tables have proper foreign key constraints
            - [ ] Insert schemas created with \`createInsertSchema()\`
            - [ ] Types exported (\`$inferSelect\`, \`z.infer\`)
            - [ ] \`IStorage\` interface updated in \`server/storage.ts\`
            - [ ] \`DatabaseStorage\` implementation added
            - [ ] Barrel exports updated in \`shared/schema/\`

            #### Post-merge Actions:
            - [ ] Generate migration: \`./scripts/generate-migration.sh <name>\`
            - [ ] Review generated SQL in \`migrations/\`
            - [ ] Apply: \`npx drizzle-kit migrate\` or \`npm run db:push\`

            *Automated by Maestro CI/CD v3.3*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
